# Version: 2.0.0

runtime:
  image: "python:3.11-slim"

commands:
  package: ""
  build:
    - "apt-get update && apt-get install -y curl ca-certificates && rm -rf /var/lib/apt/lists/*"
    - "pip install -r requirements.txt"
  start: "python3 app.py"

repository:
  branch: "main"
  auto_deploy: true
